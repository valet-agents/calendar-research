name: calendar-research
display_name: Calendar Research
description: >-
  Every morning, researches the day's external meetings —
  company, founder, round — and posts briefs in your firm's
  format before the day starts.
category: venture

example:
  prompt: "Brief me on Vela Robotics before my 9am."

story:
  hero: "Walk into every founder meeting already briefed."
  subheadline: >-
    Every morning, researches the day's external meetings —
    company, founder, and round — and posts the briefs in your
    firm's format.
  steps:
    - role: trigger
      title: "Every morning."
      body: >-
        The heartbeat fires once a day and pulls every external
        meeting on the day's calendar.
    - role: action
      title: "It researches the company and founder."
      body: >-
        One morning pass: company one-liner, founder background,
        latest round, recent news via Parallel — every claim cited.
      catalog: google-calendar
    - role: outcome
      title: "Briefs in your inbox before the day starts."
      body: >-
        DM'd to you in Slack — under 250 words each, sourced,
        framed for a partner conversation. @mention it back for
        an ad-hoc brief any time.
      catalog: slack

connectors:
  - catalog: google-calendar
    description: >-
      Google Calendar via OAuth. The agent reads the install
      user's primary calendar each morning to pull the day's
      external meetings, extract attendees and notes, and
      answer ad-hoc schedule questions in Slack. Read-only.
    ui:
      headline: "Connect Google Calendar with one click."
      blurb: >-
        OAuth into Google — no API token to paste. The agent
        uses your calendar permissions to read upcoming
        meetings and the people on them.
      done_note: "Calendar connected"

  - catalog: parallel-search-mcp
    description: >-
      Parallel's deep-research search MCP. The agent uses it
      to research the day's external meetings — company
      one-liner, founder background, latest funding, recent
      news — with source URLs returned alongside every result.
      Keyless — no token required.
    ui:
      headline: "Add Parallel deep research."
      blurb: >-
        One-click connector for Parallel's search MCP — no API
        key to manage. Powers the sourced founder briefs the
        agent posts each morning.
      done_note: "Parallel ready"

channels:
  - catalog: slack
    description: >-
      The agent gets its own Slack bot. By default it DMs the
      install user with each morning's briefs — invite the
      bot to a dedicated `#briefings` channel if you'd rather
      have briefs land there, and to any channel where
      teammates should be able to @mention it for ad-hoc
      research.
    ui:
      headline: "Give Calendar Research a Slack bot."
      blurb: >-
        Briefs land in your DMs by default — invite the bot to
        a `#briefings` (or `#prep`, `#meetings`) channel to
        route them there instead. @mention it anywhere for
        ad-hoc briefs.
      done_note: "Bot ready — briefs will DM you"

  - type: heartbeat
    every: 24h
    description: "Pulls the day's external meetings from the calendar each morning and posts briefs."
